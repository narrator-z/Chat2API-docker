services:
  chat2api:
    image: ghcr.io/narrator-z/chat2api-docker:latest

    container_name: chat2api

    ports:
      - "14500:14500"
      - "58002:8080"

    volumes:
      - ./downloads:/app/downloads
      - ./config:/root

    restart: always

networks:
  chat2api:
    external: true
    name: chat2api
